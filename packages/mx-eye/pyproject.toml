[project]
name = 'mx-eye'
version = '0.1.0'
description = 'MXBI pupil and corneal reflection tracker'
requires-python = '>=3.11'
dependencies = [
    "pyzmq>=27,<28",
    "mx-eye-protocol",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
gui = ['numpy>=1.24,<3', 'opencv-python-headless>=4.8,<5', 'psutil>=5.9,<8', 'PySide6>=6.6,<7', 'pyqtgraph>=0.13,<0.15', "pygrabber>=0.2; sys_platform == 'win32'"]
test = ['pytest>=8,<10']

[project.scripts]
mx-eye = 'mx_eye.__main__:main'

[build-system]
requires = ['uv_build>=0.12.19,<0.13.0']
build-backend = 'uv_build'

[tool.uv.sources]
mx-eye-protocol = { workspace = true }
