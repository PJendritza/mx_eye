[project]
name = 'py-mx-eye'
version = '0.1.0'
description = 'Python SDK for the mx-eye eye tracker'
requires-python = '>=3.11'
dependencies = [
    "mx-eye-protocol",
    "pydantic>=2,<3",
]

[build-system]
requires = ['uv_build>=0.12.19,<0.13.0']
build-backend = 'uv_build'

[tool.uv.sources]
mx-eye-protocol = { workspace = true }
