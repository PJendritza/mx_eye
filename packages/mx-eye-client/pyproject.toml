[project]
name = 'mx-eye-client'
version = '0.1.0'
description = 'Remote desktop client for the mx-eye tracker'
requires-python = '>=3.11'
dependencies = [
    "numpy>=1.24,<3",
    "py-mx-eye",
    "pyqtgraph>=0.13,<0.15",
    "pyside6>=6.6,<7",
]

[project.scripts]
mx-eye-receiver = 'mx_eye_client.__main__:main'

[build-system]
requires = ['uv_build>=0.12.19,<0.13.0']
build-backend = 'uv_build'

[tool.uv.sources]
py-mx-eye = { workspace = true }
