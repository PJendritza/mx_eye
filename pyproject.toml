[tool.uv.workspace]
members = ['packages/*']

[tool.pytest.ini_options]
testpaths = ['tests', 'packages/protocol/tests', 'packages/py-mx-eye/tests']

[tool.pyright]
include = [
    'packages/protocol/src/mx_eye_protocol',
    'packages/py-mx-eye/src/py_mx_eye',
]
typeCheckingMode = 'strict'
pythonVersion = '3.11'
venvPath = '.'
venv = '.venv'

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]
